name: Pipeline checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Also run a live Eurostat API smoke test"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build the pinned runtime
        run: docker compose build airflow-cli
      - name: Check formatting and imports
        run: |
          docker compose run --rm --no-deps --entrypoint python airflow-cli -m ruff check dags tests scripts
          docker compose run --rm --no-deps --entrypoint python airflow-cli -m ruff format --check dags tests scripts
      - name: Initialize a fresh PostgreSQL and Airflow database
        run: docker compose run --rm airflow-init
      - name: Run offline, PostgreSQL integration, and DAG tests
        run: >-
          docker compose run --rm
          -e TEST_DATABASE_URL=postgresql://airflow:airflow@postgres:5432/eurostat
          --entrypoint python airflow-cli -m pytest -q tests
      - name: Optional live API smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
        run: docker compose run --rm airflow-cli airflow dags test eurostat_economic_indicators
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes --remove-orphans
